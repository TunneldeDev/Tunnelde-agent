[package]
name = "tunnelde-agent"
version = "0.27.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/TunneldeDev/Tunnelde-agent"
publish = false
description = "Optional native MCP bridge and durable SSH agent runner for Tunnelde"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
