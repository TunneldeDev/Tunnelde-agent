name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: node --test tests/*.test.mjs scripts/*.test.mjs
      - name: Check Apple Silicon cross compilation
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --target aarch64-apple-darwin
          test "$(lipo -archs target/aarch64-apple-darwin/debug/tunnelde-agent)" = arm64
